# Keeps forensic_db lean. Pixie's own control/data plane (pl, px-operator, olm, …)
# is monitored to prove the SBoBs bind, but its anomalies are FP noise the dx views
# already exclude — so the base-table rows are pure bloat (a rogue vizier-pem alone
# writes millions of dx_order_edges). This CronJob deletes the dx-view-excluded
# namespaces from the FP tables every 2 min, then sweeps orphaned edges. Demo
# namespaces (redis/postgres/flux-system/…) are untouched. Lightweight DELETE.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ch-fp-cleanup
  namespace: clickhouse
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: clickhouse/clickhouse-server:24.8.14.39
              env:
                - name: CH_HOST
                  value: "clickhouse-forensic-soc-db.clickhouse.svc.cluster.local"
                # dx-view-excluded namespaces (kept in lockstep with the AE NOT IN list).
                - name: NS
                  value: "'honey','pl','clickhouse','kube-system','kube-public','kube-node-lease','local-path-storage','px-operator','olm','cert-manager'"
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  CC="clickhouse-client --host $CH_HOST --user ingest_writer --password changeme-ingest --enable_lightweight_delete=1"
                  $CC -q "DELETE FROM forensic_db.dx_orders WHERE splitByChar('/', pod)[1] IN ($NS)"
                  $CC -q "DELETE FROM forensic_db.dx_order_records WHERE splitByChar('/', pod)[1] IN ($NS)"
                  $CC -q "DELETE FROM forensic_db.kubescape_logs WHERE JSONExtractString(RuntimeK8sDetails,'podNamespace') IN ($NS)"
                  # orphaned edges: their order was just deleted (edges carry only order_id).
                  $CC -q "DELETE FROM forensic_db.dx_order_edges WHERE order_id NOT IN (SELECT order_id FROM forensic_db.dx_orders)"
                  echo "cleaned: orders=$($CC -q 'SELECT count() FROM forensic_db.dx_orders') edges=$($CC -q 'SELECT count() FROM forensic_db.dx_order_edges')"
