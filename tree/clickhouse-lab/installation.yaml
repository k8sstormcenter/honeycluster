apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: forensic-soc-db
  namespace: clickhouse
spec:
  configuration:
    zookeeper:
      nodes:
      - host: keeper-forensic-keeper.clickhouse.svc.cluster.local
        port: 2181

    clusters:
    - name: soc-cluster
      layout:
        shardsCount: 1
        replicasCount: 1

    settings:
      logger/level: information
      background_pool_size: "16"
      query_log/flush_interval_milliseconds: "5000"
      # system logs have no TTL by default and filled a 20 GB PVC to DiskPressure
      query_log/ttl: "event_date + INTERVAL 7 DAY DELETE"
      part_log/ttl: "event_date + INTERVAL 7 DAY DELETE"
      metric_log/ttl: "event_date + INTERVAL 3 DAY DELETE"
      trace_log/ttl: "event_date + INTERVAL 1 DAY DELETE"
      processors_profile_log/ttl: "event_date + INTERVAL 1 DAY DELETE"
      skip_check_for_incorrect_settings: "1"
      # bound total in-flight queries (default 100) so a burst can't peg the node
      max_concurrent_queries: "12"

    profiles:
      # Default profile: user-level session settings
      default/async_insert: "1"
      default/async_insert_max_data_size: "10485760"
      default/async_insert_busy_timeout_ms: "200"

      # Analyst: read-only, no DDL, no settings changes.
      # Governors on the UI/read path: without max_execution_time a query the UI
      # cancels client-side keeps running server-side forever; repeated opens stack
      # them until CPU saturates and the node starves (exec-into-CH then SIGILLs).
      forensic_analyst/readonly: "2"
      forensic_analyst/allow_ddl: "0"
      forensic_analyst/max_execution_time: "30"
      forensic_analyst/max_threads: "2"
      forensic_analyst/max_concurrent_queries_for_user: "4"
      forensic_analyst/max_memory_usage: "4000000000"

      # Ingest: INSERT allowed, no DELETE/ALTER/DDL.
      # Async insert: CH accumulates rows in RAM and flushes in bulk,
      # giving native-TCP-like throughput from vector's HTTP sink.
      # Moved here from the vector endpoint URL (?async_insert=1&…)
      # because CH 24.8 parses query-string bool settings strictly,
      # and vector's sink appends its own ?query=… — the two collide
      # and throw DB::Exception code 467 "Cannot parse bool".
      ingest_service/readonly: "0"
      ingest_service/allow_ddl: "1"
      ingest_service/allow_experimental_lightweight_delete: "0"
      ingest_service/allow_nondeterministic_mutations: "0"
      ingest_service/async_insert: "0"
      ingest_service/async_insert_max_data_size: "10485760"
      ingest_service/async_insert_busy_timeout_ms: "200"

    users:
      # Analyst user: SELECT only
      forensic_analyst/profile: forensic_analyst
      forensic_analyst/password: changeme-analyst
      forensic_analyst/networks/ip: "::/0"
      forensic_analyst/quota: default

      # Ingest user: INSERT only
      ingest_writer/profile: ingest_service
      ingest_writer/password: changeme-ingest
      ingest_writer/networks/ip: "::/0"
      ingest_writer/quota: default

  defaults:
    templates:
      podTemplate: forensic-pod
      dataVolumeClaimTemplate: data-volume
    replicasUseFQDN: "yes"

  templates:
    podTemplates:
    - name: forensic-pod
      spec:
        containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          # sized to the 4-vCPU / 8GiB node: cpu limit 3 (not 8) leaves a core for
          # vizier-pem/dx/kubelet so CH can't starve the whole node under load
          resources:
            requests:
              memory: 2Gi
              cpu: "1"
            limits:
              memory: 6Gi
              cpu: "3"

    volumeClaimTemplates:
    - name: data-volume
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
