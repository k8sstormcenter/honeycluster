# Kubescape state -> ClickHouse sync. Every 2 min, reads ContainerProfiles,
# RogueArtifacts and the node-agent trust-policy from the k8s API and writes
# them (timestamped snapshots) into forensic_db so the dx/* governance views can
# display them. Stdlib python only (no kubectl/pip). Self-creates the tables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ks-ch-sync
  namespace: honey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ks-ch-sync
rules:
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["containerprofiles", "rogueartifacts"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ks-ch-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ks-ch-sync
subjects:
  - kind: ServiceAccount
    name: ks-ch-sync
    namespace: honey
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ks-ch-sync
  namespace: honey
data:
  sync.py: |
    import json, os, ssl, time, datetime, base64, urllib.request, urllib.parse

    K8S = "https://kubernetes.default.svc"
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    TOKEN = open(SA + "/token").read().strip()
    CTX = ssl.create_default_context(cafile=SA + "/ca.crt")
    CH = os.environ.get("CH_ENDPOINT", "http://clickhouse-forensic-soc-db.clickhouse.svc.cluster.local:8123")
    AUTH = "Basic " + base64.b64encode(
        (os.environ.get("CH_USER", "ingest_writer") + ":" + os.environ.get("CH_PASS", "changeme-ingest")).encode()).decode()
    HOST = os.environ.get("SHARD_HOST") or os.environ["NODE_NAME"]
    STAMP = {"event_time": int(time.time() * 1e9), "hostname": HOST,
             "ts": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")}
    GRP = "/apis/spdx.softwarecomposition.kubescape.io/v1beta1"

    def kget(path):
        req = urllib.request.Request(K8S + path, headers={"Authorization": "Bearer " + TOKEN})
        return json.loads(urllib.request.urlopen(req, context=CTX, timeout=30).read())

    def ch(query, data=b""):
        req = urllib.request.Request(CH + "/?query=" + urllib.parse.quote(query), data=data,
                                     headers={"Authorization": AUTH})
        return urllib.request.urlopen(req, timeout=30).read()

    def insert(table, rows):
        for r in rows:
            r.update(STAMP)
        if rows:
            ch("INSERT INTO forensic_db." + table + " FORMAT JSONEachRow",
               "\n".join(json.dumps(r) for r in rows).encode())
        print("  %s: %d" % (table, len(rows)))

    ch("CREATE TABLE IF NOT EXISTS forensic_db.kubescape_profiles (event_time UInt64, hostname String, ts DateTime, namespace String, name String, kind String, managed_by String, completion String, status String, signed Int64, signer_identity String, signer_issuer String, execs String, opens String, egress String, ingress String, syscalls String, capabilities String) ENGINE=MergeTree ORDER BY (event_time, namespace, name)")
    ch("CREATE TABLE IF NOT EXISTS forensic_db.kubescape_rogueartifacts (event_time UInt64, hostname String, ts DateTime, namespace String, name String, container_name String, workload_name String, workload_kind String, pod_name String, rogue_phase String) ENGINE=MergeTree ORDER BY (event_time, namespace, name)")
    ch("CREATE TABLE IF NOT EXISTS forensic_db.kubescape_trust (event_time UInt64, hostname String, ts DateTime, class String, signer_key String, allowed_paths String) ENGINE=MergeTree ORDER BY (event_time, class, signer_key)")
    # A rogue that heals is DELETED from the cluster (no Healed phase, healedAt stays
    # null), so ks-sync just stops snapshotting it. Derive the lifecycle from absence:
    # per (namespace,name), still in the latest snapshot => Firing, else Healed at its
    # last-seen. started/stopped are human-readable; event_time+hostname kept for the
    # px connector (shard + time filter).
    ch("CREATE OR REPLACE VIEW forensic_db.kubescape_rogue_lifecycle AS "
       "SELECT namespace, name, hostname, last_event_time AS event_time, pod_name, container_name, "
       "workload_kind, workload_name, started_firing, "
       "if(last_event_time = (SELECT max(event_time) FROM forensic_db.kubescape_rogueartifacts), 'Firing', 'Healed') AS phase, "
       "if(last_event_time = (SELECT max(event_time) FROM forensic_db.kubescape_rogueartifacts), '', toString(fromUnixTimestamp64Nano(last_event_time))) AS stopped_firing, "
       "snapshots FROM ("
       "SELECT namespace, name, any(hostname) AS hostname, max(event_time) AS last_event_time, "
       "any(pod_name) AS pod_name, any(container_name) AS container_name, "
       "any(workload_kind) AS workload_kind, any(workload_name) AS workload_name, "
       "toString(fromUnixTimestamp64Nano(min(event_time))) AS started_firing, count() AS snapshots "
       "FROM forensic_db.kubescape_rogueartifacts GROUP BY namespace, name)")

    # Carry the profile CONTENT, not counts — the shadow_profiles view shows what
    # a profile actually allows. Newline-joined so each behaviour is one line.
    def _paths(items):
        return "\n".join(sorted({(i.get("path") or "") for i in (items or [])} - {""}))
    def _endpoints(items):
        # Prefer a human-meaningful target: external DNS, else the peer's label
        # selector (app=dx-daemon), else the ns selector — the raw identifier hash
        # is a last resort (it tells the reader nothing).
        out = set()
        for e in (items or []):
            dns = ",".join(e.get("dnsNames") or []) or e.get("dns") or ""
            ps = (e.get("podSelector") or {}).get("matchLabels") or {}
            ns = (e.get("namespaceSelector") or {}).get("matchLabels") or {}
            sel = ",".join(k + "=" + v for k, v in sorted(ps.items()))
            nsel = ",".join(k + "=" + v for k, v in sorted(ns.items()))
            tgt = dns or sel or nsel or e.get("identifier") or ""
            ports = ",".join(str(p.get("port", "")) + "/" + (p.get("protocol") or "") for p in (e.get("ports") or []))
            out.add((tgt + " " + ports).strip())
        return "\n".join(sorted(out - {""}))
    def _procs(items):
        # allowedProcesses: the full command (path + args), not just the binary path.
        out = set()
        for i in (items or []):
            p = i.get("path") or ""
            args = i.get("args") or []
            out.add((p + " " + " ".join(args[1:])).strip() if len(args) > 1 else p)
        return "\n".join(sorted(out - {""}))
    def _eps(items, direction):
        # the endpoints stanza, filtered by direction; folded into egress/ingress so
        # those columns carry the WHOLE picture (network neighbours + HTTP endpoints).
        out = set()
        for e in (items or []):
            if (e.get("direction") or "") != direction:
                continue
            out.add((",".join(e.get("methods") or []) + " " + (e.get("endpoint") or "")).strip())
        return "\n".join(sorted(out - {""}))

    prows = []
    # LIST truncates ContainerProfile.spec (execs/opens/egress come back empty);
    # GET each profile individually for the real behaviour set.
    for lit in kget(GRP + "/containerprofiles").get("items", []):
        ns = lit["metadata"].get("namespace", ""); nm = lit["metadata"].get("name", "")
        it = kget(GRP + "/namespaces/" + ns + "/containerprofiles/" + nm)
        m = it.get("metadata", {}); a = m.get("annotations", {}) or {}; l = m.get("labels", {}) or {}; s = it.get("spec", {}) or {}
        mb = l.get("kubescape.io/managed-by", "")
        prows.append({"namespace": m.get("namespace", ""), "name": m.get("name", ""),
                      "kind": "user" if mb == "user" else "shadow", "managed_by": mb,
                      "completion": a.get("kubescape.io/completion", ""), "status": a.get("kubescape.io/status", ""),
                      "signed": 1 if a.get("signature.kubescape.io/signature") else 0,
                      "signer_identity": a.get("signature.kubescape.io/identity", ""),
                      "signer_issuer": a.get("signature.kubescape.io/issuer", ""),
                      "execs": _procs(s.get("execs")), "opens": _paths(s.get("opens")),
                      "egress": "\n".join(x for x in [_endpoints(s.get("egress")), _eps(s.get("endpoints"), "outbound")] if x),
                      "ingress": "\n".join(x for x in [_endpoints(s.get("ingress")), _eps(s.get("endpoints"), "inbound")] if x),
                      "syscalls": ",".join(s.get("syscalls") or []), "capabilities": ",".join(s.get("capabilities") or [])})
    insert("kubescape_profiles", prows)

    # RogueArtifact.spec is LIST-truncated (podName came back empty) and carries no
    # workloadName/Kind at all — read pod from the label and resolve the owning
    # workload from the pod's ownerReferences (ReplicaSet -> its Deployment).
    rrows = []
    for it in kget(GRP + "/rogueartifacts").get("items", []):
        m = it["metadata"]; l = m.get("labels", {}) or {}; st = it.get("status", {}) or {}
        ns = m.get("namespace", ""); pod = l.get("kubescape.io/pod", "")
        wl_kind = ""; wl_name = ""
        if pod:
            try:
                orefs = (kget("/api/v1/namespaces/" + ns + "/pods/" + pod).get("metadata", {}) or {}).get("ownerReferences") or []
                if orefs:
                    wl_kind = orefs[0].get("kind", ""); wl_name = orefs[0].get("name", "")
                    if wl_kind == "ReplicaSet":
                        wl_kind = "Deployment"; wl_name = wl_name.rsplit("-", 1)[0]
            except Exception:
                pass
        rrows.append({"namespace": ns, "name": m.get("name", ""),
                      "container_name": l.get("kubescape.io/container-name", ""),
                      "workload_name": wl_name, "workload_kind": wl_kind,
                      "pod_name": pod,
                      "rogue_phase": st.get("phase", "") or l.get("kubescape.io/rogue-phase", "") or "Firing"})
    insert("kubescape_rogueartifacts", rrows)

    trows = []
    try:
        cm = kget("/api/v1/namespaces/honey/configmaps/node-agent-bundle-policy")
        doc = json.loads(cm["data"]["trust-policy.json"])
        for cls, cfg in (doc.get("policy") or doc).get("classes", {}).items():
            for sk in cfg.get("signers", []):
                trows.append({"class": cls, "signer_key": sk, "allowed_paths": ",".join(cfg.get("allowedSpecPaths", []))})
    except Exception as e:
        print("  trust:", e)
    insert("kubescape_trust", trows)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ks-ch-sync
  namespace: honey
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: ks-ch-sync
          restartPolicy: Never
          containers:
            - name: sync
              image: python:3.11-slim
              command: ["python3", "/scripts/sync.py"]
              env:
                # Shard host MUST be a node where a vizier PEM runs: the PEM injects
                # `WHERE hostname = gethostname()` (its own node — it is hostNetwork)
                # on every clickhouse_dsn read, so rows stamped with any other value
                # return 0. A CronJob has no control-plane toleration, so it lands on
                # a worker, which always has a PEM — its own node is a valid shard host.
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: ks-ch-sync
